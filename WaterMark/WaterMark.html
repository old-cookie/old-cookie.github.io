<!doctype html>
<html lang="zh-HK">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片水印工具</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@anyblades/blades@3/css/blades.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="WaterMark.css" />
</head>

<body>
  <main class="container-fluid">

    <hgroup>
      <h1>照片水印工具</h1>
      <nav aria-label="breadcrumb">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li>WaterMark</li>
        </ul>
      </nav>
    </hgroup>

    <article class="upload-area" id="uploadArea">
      <header>上傳照片</header>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </article>

    <section id="imagesContainer"></section>

    <article id="previewSection" hidden>
      <header>預覽</header>
      <div class="grid" id="previewContainer"></div>
      <footer>
        <button id="downloadAllBtn">全部下載</button>
      </footer>
    </article>

  </main>

  <script src="State.js"></script>
  <script src="File.js"></script>
  <script src="UI.js"></script>
  <script src="WaterMark.js"></script>
</body>

</html>
