<!doctype html>
<html lang="zh-HK">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>oldcookie's Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@anyblades/blades@3/css/blades.min.css" crossorigin="anonymous">
  <style>
    /* Blades' .grid sizes columns by child count; cards need a readable min width. */
    .project-grid {
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
    }

    /* Fill each cell so the footer can be pushed to the bottom. */
    .project-grid > div {
      display: flex;
    }

    .project-grid article {
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-bottom: 0;
    }

    /* Descriptions vary in length; keep every button on the same line. */
    .project-grid article footer {
      margin-top: auto;
    }

    .project-grid article footer a {
      width: 100%;
    }
  </style>

</head>

<body>
  <main class="container">
    <h1>專案作品集</h1>
    <p>一些自己寫的小工具，點進去就能用。</p>

    <!-- Project cards: this list is authoritative; keep paths and casing exact. -->
    <div class="grid project-grid">
      <div>
        <article>
          <header>Avatar 預覽器</header>
          單張照片上傳、圓形遮罩裁切與 3000 x 3000 PNG 匯出。
          <footer>
            <a href="AvatarPreview/AvatarPreview.html" role="button" title="Avatar 預覽器"
              data-tooltip="https://old-cookie.github.io/AvatarPreview/AvatarPreview.html">立即試用</a>
          </footer>
        </article>
      </div>

      <div>
        <article>
          <header>數位浮水印工具</header>
          浮水印添加。
          <footer>
            <a href="WaterMark/WaterMark.html" role="button" title="數位浮水印工具"
              data-tooltip="https://old-cookie.github.io/WaterMark/WaterMark.html">立即體驗</a>
          </footer>
        </article>
      </div>

      <div>
        <article>
          <header>海龜湯題庫</header>
          互動式推理謎題平台，收錄豐富的海龜湯題目，挑戰你的邏輯思維與推理能力。
          <footer>
            <a href="Soup/soup.html" role="button" title="海龜湯題庫"
              data-tooltip="https://old-cookie.github.io/Soup/soup.html">立即挑戰</a>
          </footer>
        </article>
      </div>

      <div>
        <article>
          <header>LYWSD02 時鐘同步</header>
          透過瀏覽器藍牙連接 Xiaomi LYWSD02 快速將裝置時間同步到目前本機時間。
          <footer>
            <a href="LYWSD02ClockSync/LYWSD02ClockSync.html" role="button" title="LYWSD02 時鐘同步工具"
              data-tooltip="https://old-cookie.github.io/LYWSD02ClockSync/LYWSD02ClockSync.html">立即同步</a>
          </footer>
        </article>
      </div>

    </div>
  </main>
</body>

</html>
