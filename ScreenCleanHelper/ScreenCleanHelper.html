<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark">
    <title>Screen Clean Helper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="ScreenCleanHelper.css" />
</head>

<body>
    <main class="container-fluid">
        <hgroup class="panel">
            <h1>Screen Clean Helper</h1>
            <p>
                Press the button to turn the screen into a black full-screen mode.
                Any input exits the mode.
            </p>
            <button type="button" id="cleanBtn">Turn on Screen Clean</button>
        </hgroup>
    </main>

    <div class="clean-overlay" aria-hidden="true"></div>

    <script src="ScreenCleanHelper.js"></script>
</body>

</html>
