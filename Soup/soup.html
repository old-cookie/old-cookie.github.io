<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>海龜湯題庫</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@anyblades/blades@3/css/blades.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="soup.css" />

    <!-- SheetJS for Excel processing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
    <script src="xlsx.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
  </head>

  <body>
    <header class="container">
      <article aria-label="海龜湯題庫控制區">
        <h1 id="page-title">海龜湯題庫</h1>
        <p id="page-subtitle">點擊卡片查看詳情</p>

        <form id="search-form" role="search" novalidate>
          <input
            id="search-input"
            type="search"
            placeholder="搜尋海龜湯"
            aria-label="搜尋海龜湯"
            autocomplete="off"
          />
          <button id="add-soup-button" type="button">+ 新增海龜湯</button>
        </form>
      </article>
    </header>

    <main class="container" aria-live="polite">
      <section id="soup-container" class="soup-grid" aria-label="海龜湯列表">
  
      </section>
    </main>
    <script src="soup.js"></script>
  </body>
</html>
